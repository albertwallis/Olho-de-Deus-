<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olho de Deus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Estética fixa (preto + verde terminal) nos dois temas, por decisão de design. */
  :root {
    --bg:#000; --fg:#00ff9c; --dim:#0b8a55; --hi:#eafff6; --warn:#ff3b5c; --amber:#ffb020;
    --panel:rgba(2,14,9,.94); --line:rgba(0,255,156,.35);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --fg:#00ff9c; --dim:#0b8a55; --hi:#eafff6; --warn:#ff3b5c; --amber:#ffb020; } }
  :root[data-theme="dark"] { --bg:#000; --fg:#00ff9c; --dim:#0b8a55; --hi:#eafff6; --warn:#ff3b5c; --amber:#ffb020; }
  *,*::before,*::after { box-sizing:border-box; }
  html { height:100%; background:#000; scroll-padding-top:env(safe-area-inset-top,0px); }
  body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:"Share Tech Mono","Courier New",monospace; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body::after { content:""; position:fixed; inset:0; z-index:60; pointer-events:none; opacity:.12;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.9) 3px); }
  button { min-height:44px; padding:10px 16px; background:transparent; color:var(--fg); border:1px solid var(--fg); font:inherit; font-size:13px; letter-spacing:.06em; cursor:pointer; }
  button:hover { background:rgba(0,255,156,.12); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--hi); outline-offset:2px; }
  button.quiet { color:var(--dim); border-color:var(--dim); }
  button.pri { background:rgba(0,255,156,.16); }
  button.danger { color:var(--warn); border-color:var(--warn); }
  button.sm { min-height:36px; min-width:36px; padding:4px 10px; font-size:12px; }
  input, textarea, select { background:#010805; color:var(--fg); border:1px solid var(--dim); font:inherit; font-size:16px; padding:8px 10px; width:100%; }
  .grow { flex:1; }

  /* ---------- BLOQUEIO ---------- */
  #lock { position:fixed; inset:0; z-index:20; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px); overflow:auto; }
  #title { margin:0; font-family:"VT323","Share Tech Mono",monospace; font-weight:400; font-size:clamp(34px,9vw,52px); letter-spacing:.18em; text-shadow:0 0 10px rgba(0,255,156,.8),0 0 26px rgba(0,255,156,.4); }
  #startBox, #scanBox { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; }
  #startBox .note { max-width:420px; text-align:center; font-size:13px; line-height:1.55; color:var(--dim); margin:0; }
  #sensor { position:relative; width:min(58vmin,280px); aspect-ratio:1; border-radius:50%; overflow:hidden; border:2px solid var(--fg); background:#020a06;
    box-shadow:0 0 26px rgba(0,255,156,.35), inset 0 0 26px rgba(0,255,156,.25); flex:none; }
  #cam, #ov { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #cam { filter:grayscale(1) contrast(1.25) brightness(.85); }
  #sensor::after { content:""; position:absolute; inset:0; pointer-events:none; background:rgba(0,255,156,.2); mix-blend-mode:screen; }
  .sweep { position:absolute; left:0; right:0; top:0; height:3px; z-index:2; background:linear-gradient(90deg,transparent,#00ff9c,transparent); box-shadow:0 0 12px #00ff9c; animation:sweep 2.2s linear infinite; }
  @keyframes sweep { from{top:0} to{top:100%} }
  #hint { min-height:1.4em; font-size:13px; letter-spacing:.1em; color:var(--amber); text-align:center; }
  #hint.ok { color:var(--fg); }
  #log { width:min(92vw,420px); height:9.2em; overflow:hidden; text-align:left; font-size:13px; line-height:1.5; }
  .ln { white-space:pre-wrap; word-break:break-word; }
  .ln:last-child::after { content:"▌"; animation:blink 1s steps(2) infinite; }
  .ln.dim{color:var(--dim)} .ln.bad{color:var(--warn)} .ln.ok{color:var(--hi);text-shadow:0 0 8px rgba(0,255,156,.8)}
  #bar { width:min(92vw,420px); height:5px; border:1px solid var(--dim); }
  #barfill { display:block; height:100%; width:0; background:var(--fg); box-shadow:0 0 10px var(--fg); transition:width .15s linear; }
  #actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  @keyframes blink { 50%{opacity:0} }

  /* ---------- OLHO ---------- */
  #stage { position:fixed; inset:0; z-index:1; display:none; transition:opacity 1.4s; }
  #stage.dim { opacity:.2; }
  #welcome { position:fixed; left:0; right:0; z-index:3; padding:0 16px; text-align:center; font-family:"VT323","Share Tech Mono","Courier New",monospace;
    font-size:clamp(24px,6.6vw,46px); letter-spacing:.1em; line-height:1.15; text-wrap:balance; opacity:0; pointer-events:none; transition:opacity .8s;
    text-shadow:0 0 8px rgba(0,255,156,.9),0 0 24px rgba(0,255,156,.5); }
  #welcome.on { opacity:1; }
  #welcome.glitch { animation:glitch 4.5s infinite; }
  .cur { animation:blink 1s steps(2) infinite; }
  @keyframes glitch { 0%,91%,100%{transform:none} 92%{transform:translateX(-4px);text-shadow:3px 0 #ff2bd6,-3px 0 #00e5ff} 94%{transform:translateX(4px) skewX(-6deg);text-shadow:-3px 0 #ff2bd6,3px 0 #00e5ff} 96%{transform:translateX(-2px)} }

  /* ---------- ÁREA DE TRABALHO ---------- */
  #ws { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity 1.2s;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  #ws.on { opacity:1; pointer-events:auto; }
  #wsbar { display:flex; align-items:center; gap:10px; padding:6px 60px 6px 10px; border-bottom:1px solid var(--line); background:rgba(0,10,6,.88); flex:none; }
  .brand { font-family:"VT323",monospace; font-size:24px; letter-spacing:.14em; text-shadow:0 0 8px rgba(0,255,156,.7); }
  #tabs { display:flex; gap:6px; }
  .tabbtn { min-height:38px; padding:6px 12px; border-color:var(--dim); color:var(--dim); }
  .tabbtn[aria-selected="true"] { color:var(--fg); border-color:var(--fg); background:rgba(0,255,156,.12); }
  #modeflag { font-size:11px; color:var(--amber); }
  @media (max-width:640px){ .brand{display:none} #tabs{flex:1} .tabbtn{flex:1} }
  #wsmain { flex:1; min-height:0; position:relative; }
  .pane { position:absolute; inset:0; display:none; }
  .pane.on { display:block; }
  #icons { position:absolute; inset:0; overflow:auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:14px; align-content:start; }
  .icon { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; min-height:112px; border:1px solid transparent; background:transparent; }
  .icon:hover { border-color:var(--line); }
  .icon .fold { width:64px; height:48px; filter:drop-shadow(0 0 6px rgba(0,255,156,.5)); }
  .icon .ic-name { font-size:13px; text-align:center; word-break:break-word; }
  .icon .ic-meta { font-size:11px; color:var(--dim); }
  .icon.add { border:1px dashed var(--dim); color:var(--dim); justify-content:center; }
  .icon .plus { font-size:34px; line-height:1; }
  .icon.pop { animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { 0%{opacity:0;transform:scale(.4) translateY(30px);filter:brightness(3)} 100%{opacity:1;transform:none} }
  #winlayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .win { position:absolute; width:min(500px,94%); height:min(440px,84%); display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--fg);
    box-shadow:0 0 28px rgba(0,255,156,.2); pointer-events:auto; animation:winIn .28s ease-out; }
  @keyframes winIn { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:none} }
  @media (max-width:759px){ .win{ inset:0 !important; width:auto !important; height:auto !important; } }
  .wtitle { display:flex; align-items:center; gap:8px; padding:6px 8px 6px 12px; border-bottom:1px solid var(--line); touch-action:none; user-select:none; cursor:grab; flex:none; }
  .wt { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wbar { display:flex; flex-wrap:wrap; gap:6px; padding:8px; border-bottom:1px dashed var(--line); flex:none; }
  .wbody { flex:1; overflow:auto; padding:8px; min-height:0; }
  .row { display:flex; align-items:center; gap:6px; border:1px solid transparent; }
  .row:hover { border-color:var(--line); }
  .rowmain { flex:1; min-width:0; display:flex; align-items:center; gap:10px; text-align:left; border:none; padding:6px; min-height:52px; }
  .rt { display:flex; flex-direction:column; min-width:0; }
  .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:11px; color:var(--dim); }
  .gl { width:38px; height:38px; flex:none; border:1px solid var(--dim); display:grid; place-items:center; font-size:10px; color:var(--dim); overflow:hidden; }
  .gl img { width:100%; height:100%; object-fit:cover; }
  .ract { display:flex; gap:4px; flex:none; }
  .empty { padding:24px 8px; color:var(--dim); text-align:center; font-size:13px; }
  .ed { display:flex; flex-direction:column; gap:8px; height:100%; }
  .ed textarea { flex:1; min-height:180px; resize:none; font-size:15px; line-height:1.5; }
  .viewer { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .viewer img, .viewer video { max-width:100%; max-height:52vh; border:1px solid var(--line); background:#000; }
  .viewer audio { width:100%; }

  /* ---------- MAPA ---------- */
  #tab-map.on { display:grid; grid-template-rows:minmax(0,1fr) minmax(0,44%); }
  @media (min-width:900px){ #tab-map.on { grid-template-columns:minmax(0,1fr) 370px; grid-template-rows:minmax(0,1fr); } }
  #mapwrap { position:relative; overflow:hidden; background:#000; min-height:0; }
  #mapcv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  #mapctl { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:6px; }
  #mapctl button { background:rgba(0,10,6,.8); min-width:44px; }
  #maphint, #maperr { position:absolute; left:8px; right:64px; top:8px; padding:8px 10px; background:rgba(0,10,6,.9); border:1px solid var(--amber); color:var(--amber); font-size:12px; }
  #maperr { top:auto; bottom:8px; right:8px; border-color:var(--dim); color:var(--dim); }
  #mappanel { overflow:auto; padding:10px; border-top:1px solid var(--line); background:var(--panel); min-height:0; }
  @media (min-width:900px){ #mappanel{ border-top:none; border-left:1px solid var(--line); } }
  .phead { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .phead h2 { margin:0; font-family:"VT323",monospace; font-weight:400; font-size:24px; letter-spacing:.1em; flex:1; }
  .loc { display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:1px solid transparent; padding:6px 8px; min-height:46px; }
  .loc:hover { border-color:var(--line); }
  .loc .ln1 { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .loc .tm { font-variant-numeric:tabular-nums; color:var(--hi); }
  .dn { width:10px; height:10px; border-radius:50%; flex:none; }
  .dn.d { background:#ffd25a; box-shadow:0 0 8px #ffd25a; } .dn.n { background:#5aa9ff; box-shadow:0 0 8px #5aa9ff; } .dn.t { background:#ff8a5a; }
  .bigclock { font-family:"VT323",monospace; font-size:clamp(48px,14vw,72px); line-height:1; text-shadow:0 0 12px rgba(0,255,156,.7); font-variant-numeric:tabular-nums; }
  .kv { font-size:13px; line-height:1.7; color:var(--dim); }
  .kv b { color:var(--fg); font-weight:400; }
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; margin:8px 0; }
  .th { position:relative; aspect-ratio:1; border:1px solid var(--line); overflow:hidden; padding:0; min-height:0; }
  .th img, .th video { width:100%; height:100%; object-fit:cover; display:block; }
  .th .pb { position:absolute; inset:auto 4px 4px auto; background:rgba(0,0,0,.7); padding:1px 5px; font-size:11px; }
  .sect { margin:12px 0 4px; font-size:12px; letter-spacing:.14em; color:var(--dim); }
  #lightbox { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.96); display:flex; flex-direction:column; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  #lightbox .lbtop { display:flex; gap:8px; align-items:center; padding:8px; flex-wrap:wrap; }
  #lightbox .lbtop { padding-right:64px; }
  #lightbox .lbmedia { flex:1; min-height:0; display:grid; place-items:center; padding:8px; }
  #lightbox img, #lightbox video { max-width:100%; max-height:100%; }

  /* ---------- GLOBAL ---------- */
  #mute { position:fixed; top:calc(env(safe-area-inset-top,0px) + 6px); right:8px; z-index:50; min-width:44px; padding:6px 10px; background:rgba(0,10,6,.85); }
  #modalRoot { position:fixed; inset:0; z-index:70; pointer-events:none; }
  .mback { position:fixed; inset:0; background:rgba(0,0,0,.75); display:grid; place-items:center; padding:16px; pointer-events:auto; }
  .mbox { width:min(440px,100%); max-height:88vh; overflow:auto; background:#020c08; border:1px solid var(--fg); padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:0 0 30px rgba(0,255,156,.25); }
  .mtitle { font-size:14px; line-height:1.5; }
  .mbtns { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  .mlist { display:flex; flex-direction:column; gap:6px; }
  .mlist button { text-align:left; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); transform:translate(-50%,20px); z-index:80; background:#020c08; border:1px solid var(--fg);
    padding:10px 14px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; max-width:90vw; text-align:center; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  @media (prefers-reduced-motion: reduce){ .sweep,.icon.pop,.win{ animation:none } }
</style>
</head>
<body>

<div id="lock">
  <h1 id="title">OLHO DE DEUS</h1>
  <div id="startBox">
    <p class="note">O sistema usa a câmera frontal para reconhecer a região do seu olho. As imagens são analisadas no próprio aparelho, não são gravadas nem enviadas; só um código numérico do seu olho fica salvo neste navegador.</p>
    <button id="startBtn" type="button" class="pri">Iniciar sistema</button>
  </div>
  <div id="scanBox" hidden>
    <div id="sensor" aria-label="Sensor óptico">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="ov" width="300" height="300"></canvas>
      <div class="sweep"></div>
    </div>
    <div id="hint" aria-live="polite"></div>
    <div id="log" aria-live="polite"></div>
    <div id="bar"><i id="barfill"></i></div>
    <div id="actions" hidden>
      <button id="retry" type="button">Tentar novamente</button>
      <button id="usePin" type="button" hidden>Usar PIN</button>
      <button id="tempMode" type="button" class="quiet" hidden>Modo sem câmera (dados temporários)</button>
      <button id="wipe" type="button" class="quiet" hidden>Apagar cadastro e dados</button>
    </div>
  </div>
</div>

<canvas id="stage"></canvas>
<div id="welcome" aria-live="polite"></div>

<div id="ws">
  <div id="wsbar">
    <span class="brand">OLHO DE DEUS</span>
    <div id="tabs" role="tablist">
      <button class="tabbtn" role="tab" data-tab="folders" aria-selected="true" type="button">Pastas</button>
      <button class="tabbtn" role="tab" data-tab="map" aria-selected="false" type="button">Mapa mundial</button>
    </div>
    <span class="grow"></span>
    <span id="modeflag"></span>
    <button id="btnSettings" class="sm" type="button" aria-label="Configurações">⚙</button>
  </div>
  <div id="wsmain">
    <section id="tab-folders" class="pane on">
      <div id="icons"></div>
      <div id="winlayer"></div>
    </section>
    <section id="tab-map" class="pane">
      <div id="mapwrap">
        <canvas id="mapcv"></canvas>
        <div id="mapctl">
          <button id="zin" type="button" aria-label="Aproximar">+</button>
          <button id="zout" type="button" aria-label="Afastar">−</button>
          <button id="zreset" type="button" aria-label="Recentralizar">⌂</button>
        </div>
        <div id="maphint" hidden></div>
        <div id="maperr" hidden></div>
      </div>
      <aside id="mappanel"></aside>
    </section>
  </div>
</div>

<button id="mute" type="button" aria-label="Som">♪</button>
<div id="lightbox" hidden></div>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<script>
(function () {
'use strict';
/* ===== utilidades ===== */
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (x, l, h) => Math.max(l, Math.min(h, x));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = (k) => { try { sessionStorage.removeItem(k); } catch (e) {} };
const p2 = (n) => String(n).padStart(2, '0');

function append(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach((x) => append(e, x));
  else e.append(c.nodeType ? c : document.createTextNode(String(c)));
}
function el(tag, props) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
const extOf = (n) => (String(n).split('.').pop() || '').toLowerCase();
const MIMES = { mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm', m4v: 'video/mp4', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', mp3: 'audio/mpeg', wav: 'audio/wav', m4a: 'audio/mp4', ogg: 'audio/ogg', pdf: 'application/pdf' };

/* ===== efeitos sonoros (Web Audio, tudo sintetizado: compressor + reverb) ===== */
const Sfx = (function () {
  let ctx = null, master = null, dry = null, wet = null, muted = lsGet('odd_muted') === '1', hum = null, scan = null, scanT = 0, nbuf = null, amb = 0;
  const VOL = 0.75;
  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : VOL;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
        master.connect(comp); comp.connect(ctx.destination);
        dry = ctx.createGain(); dry.connect(master);
        const len = Math.floor(ctx.sampleRate * 2.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
        const conv = ctx.createConvolver(); conv.buffer = ir;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
        wet = ctx.createGain(); wet.gain.value = 0.6; wet.connect(conv); conv.connect(lp); lp.connect(master);
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  }
  function setMuted(m) { muted = m; lsSet('odd_muted', m ? '1' : '0'); if (master) master.gain.setTargetAtTime(m ? 0 : VOL, ctx.currentTime, 0.03); }

  // liga um nó à saída seca, ao reverb (o.wet) e ao painel estéreo (o.pan)
  function out(node, o) {
    let last = node;
    if (o.pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; last.connect(p); last = p; }
    last.connect(dry);
    if (o.wet) { const s = ctx.createGain(); s.gain.value = o.wet; last.connect(s); s.connect(wet); }

/* ===== armazenamento local (IndexedDB, com reserva em memória) ===== */
const Store = (function () {
  const NAMES = ['folders', 'items', 'pins', 'media', 'meta'];
  let db = null, mem = null, persistent = false;
  const newMem = () => { const m = {}; NAMES.forEach((n) => (m[n] = new Map())); return m; };
  function open() {
    return new Promise((resolve) => {
      if (!window.indexedDB) { mem = newMem(); return resolve(false); }
      let done = false;
      const fin = (ok) => { if (done) return; done = true; if (!ok) mem = newMem(); persistent = ok; resolve(ok); };
      try {
        const rq = indexedDB.open('olho-de-deus', 1);
        rq.onupgradeneeded = () => { const d = rq.result; NAMES.forEach((n) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
        rq.onsuccess = () => { db = rq.result; fin(true); };
        rq.onerror = () => fin(false); rq.onblocked = () => fin(false);
        setTimeout(() => fin(false), 4000);
      } catch (e) { fin(false); }
    });
  }
  function useMemory() { db = null; mem = newMem(); persistent = false; }
  function req(store, mode, fn) {
    return new Promise((resolve, reject) => {
      try {
        const tx = db.transaction(store, mode), r = fn(tx.objectStore(store));
        tx.oncomplete = () => resolve(r ? r.result : undefined); tx.onerror = tx.onabort = () => reject(tx.error);
      } catch (e) { reject(e); }
    });
  }
  const get = (s, id) => (mem ? Promise.resolve(mem[s].get(id)) : req(s, 'readonly', (os) => os.get(id)));
  const all = (s) => (mem ? Promise.resolve(Array.from(mem[s].values())) : req(s, 'readonly', (os) => os.getAll()).then((r) => r || []));
  const put = (s, o) => (mem ? (mem[s].set(o.id, o), Promise.resolve(o)) : req(s, 'readwrite', (os) => os.put(o)).then(() => o));
  const del = (s, id) => (mem ? (mem[s].delete(id), Promise.resolve()) : req(s, 'readwrite', (os) => os.delete(id)));
  async function clearAll() { if (mem) { NAMES.forEach((n) => mem[n].clear()); return; } for (const n of NAMES) await req(n, 'readwrite', (os) => os.clear()); }
  return { open: open, useMemory: useMemory, get: get, all: all, put: put, del: del, clearAll: clearAll, persistent: () => persistent };
})();

/* ===== interface: modais, avisos, downloads ===== */
const ui = (function () {
  function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2600); }
  function modal(o) {
    return new Promise((resolve) => {
      const back = el('div', { class: 'mback' }), box = el('div', { class: 'mbox', role: 'dialog', 'aria-modal': 'true' }), row = el('div', { class: 'mbtns' });
      const close = (v) => { back.remove(); resolve(v); };
      if (o.title) box.append(el('div', { class: 'mtitle', text: o.title }));
      if (o.body) box.append(o.body);
      (o.buttons || []).forEach((b) => row.append(el('button', { type: 'button', class: b.cls || '', text: b.label, onclick: () => { const r = b.onClick ? b.onClick() : b.value; if (r === false) return; close(r === undefined ? b.value : r); } })));
      box.append(row); back.append(box); $('modalRoot').append(back);
      back.addEventListener('pointerdown', (e) => { if (e.target === back) close(o.dismiss); });
      const inp = box.querySelector('input,textarea,select'); if (inp) setTimeout(() => inp.focus(), 40);
    });
  }
  async function confirm(msg, o) { o = o || {}; return !!(await modal({ title: msg, dismiss: false, buttons: [{ label: 'Cancelar', value: false, cls: 'quiet' }, { label: o.ok || 'Confirmar', value: true, cls: o.danger ? 'danger' : 'pri' }] })); }
  async function prompt(title, value, o) {
    o = o || {};
    const inp = el('input', { type: o.type || 'text', value: value || '', placeholder: o.placeholder || '', inputmode: o.inputmode || null, autocomplete: 'off', maxlength: o.max || 120 });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = inp.closest('.mbox').querySelector('.pri'); if (b) b.click(); } });
    return modal({ title: title, body: inp, dismiss: null, buttons: [{ label: 'Cancelar', value: null, cls: 'quiet' }, { label: 'OK', cls: 'pri', onClick: () => inp.value.trim() }] });
  }
  function choose(title, options) {
    return new Promise((resolve) => {
      const back = el('div', { class: 'mback' }), box = el('div', { class: 'mbox', role: 'dialog', 'aria-modal': 'true' }), list = el('div', { class: 'mlist' });
      const close = (v) => { back.remove(); resolve(v); };
      box.append(el('div', { class: 'mtitle', text: title }));
      options.forEach((op) => list.append(el('button', { type: 'button', text: op.label, style: 'padding-left:' + (12 + (op.indent || 0) * 16) + 'px', onclick: () => close(op.value) })));
      box.append(list, el('div', { class: 'mbtns' }, el('button', { type: 'button', class: 'quiet', text: 'Cancelar', onclick: () => close(undefined) })));
      back.append(box); $('modalRoot').append(back);
      back.addEventListener('pointerdown', (e) => { if (e.target === back) close(undefined); });
    });
  }
  return { toast: toast, modal: modal, confirm: confirm, prompt: prompt, choose: choose };
})();

const DL_EXT = new Set('gif png jpg jpeg webp mp4 webm txt json md docx pptx epub csv ttf html svg pdf xlsx zip'.split(' '));
const canDownload = (name) => !window.claude || DL_EXT.has(extOf(name));
async function saveFile(name, data) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl) {
    if (!DL_EXT.has(extOf(name))) { ui.toast('Este formato não pode ser baixado aqui.'); return; }
    try { await dl.save({ filename: name, data: data }); ui.toast('Enviado para salvar.'); }
    catch (e) { if (e && e.code === 'declined') return; ui.toast('Não foi possível baixar.'); }
    return;
  }
  if (window.claude) { ui.toast('Download indisponível nesta visualização.'); return; }
  const blob = data instanceof Blob ? data : new Blob([data]), url = URL.createObjectURL(blob), a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* imagem/vídeo a partir de Blob; se o navegador bloquear blob:, tenta data: */
function mediaEl(tag, blob, props, keep) {
  const node = el(tag, props), url = URL.createObjectURL(blob); if (keep) keep.push(url);
  let tried = false;
  node.addEventListener('error', () => { if (tried) return; tried = true; const fr = new FileReader(); fr.onload = () => { node.src = fr.result; }; fr.readAsDataURL(blob); });
  node.src = url; return node;
}

/* ===== Retina: localização de íris, código binário e comparação (funções puras) ===== */
const Retina = (function () {
  const NA = 80, NR = 10, K = 4, SIG = 2.2, LAM = 6.5, VALID_SIN = 0.85, MIN_BITS = 200;
  const L = NR * 2;

  const KC = new Float64Array(2 * K + 1), KS = new Float64Array(2 * K + 1);
  (function () {
    let sum = 0;
    for (let k = -K; k <= K; k++) {
      const w = Math.exp(-(k * k) / (2 * SIG * SIG));
      KC[k + K] = w * Math.cos((2 * Math.PI * k) / LAM);
      KS[k + K] = w * Math.sin((2 * Math.PI * k) / LAM);
      sum += KC[k + K];
    }
    const off = sum / (2 * K + 1);
    for (let k = 0; k < 2 * K + 1; k++) KC[k] -= off;
  })();

  function integral(g, n) {
    const w = n + 1, I = new Float64Array(w * w);
    for (let y = 0; y < n; y++) {
      let row = 0;
      for (let x = 0; x < n; x++) {
        row += g[y * n + x];
        I[(y + 1) * w + (x + 1)] = I[y * w + (x + 1)] + row;
      }
    }
    return I;
  }
  function mean(I, n, x0, y0, x1, y1) {
    x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
    x1 = Math.min(n, Math.round(x1)); y1 = Math.min(n, Math.round(y1));
    const a = (x1 - x0) * (y1 - y0);
    if (a <= 0) return 0;
    const w = n + 1;
    return (I[y1 * w + x1] - I[y0 * w + x1] - I[y1 * w + x0] + I[y0 * w + x0]) / a;
  }

  // Procura um disco escuro (íris/pupila) com fundo claro (esclera) dos dois lados.
  function localize(g, n, o) {
    const I = integral(g, n);
    let best = null;
    for (let cy = o.cMin; cy <= o.cMax; cy += o.cStep) {
      for (let cx = o.cMin; cx <= o.cMax; cx += o.cStep) {
        for (let r = o.rMin; r <= o.rMax + 1e-6; r += o.rStep) {
          if (cx - 2 * r < 0 || cx + 2 * r > n || cy - 1.2 * r < 0 || cy + 1.2 * r > n) continue;
          const hi = r * 0.8;
          const m0 = mean(I, n, cx - hi, cy - hi, cx + hi, cy + hi);
          const mL = mean(I, n, cx - 2 * r, cy - 0.7 * r, cx - 1.2 * r, cy + 0.7 * r);
          const mR = mean(I, n, cx + 1.2 * r, cy - 0.7 * r, cx + 2 * r, cy + 0.7 * r);
          const s = Math.min((mL - m0) / (mL + m0 + 8), (mR - m0) / (mR + m0 + 8));
          if (!best || s > best.score) best = { x: cx, y: cy, r: r, score: s };
        }
      }
    }
    return best && best.score >= (o.minScore || 0.1) ? best : null;
  }


  // Refina centro e raio usando a corda horizontal mais larga (robusto a pálpebras cobrindo a íris).
  function refine(g, n, l) {
    const I = integral(g, n);
    const hi = l.r * 0.8;
    const m0 = mean(I, n, l.x - hi, l.y - hi, l.x + hi, l.y + hi);
    const mL = mean(I, n, l.x - 2 * l.r, l.y - 0.7 * l.r, l.x - 1.2 * l.r, l.y + 0.7 * l.r);
    const mR = mean(I, n, l.x + 1.2 * l.r, l.y - 0.7 * l.r, l.x + 2 * l.r, l.y + 0.7 * l.r);
    const T = m0 + 0.55 * ((mL + mR) / 2 - m0);
    const sm = function (x, y) { // média 3x3
      let s = 0, c = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const xx = Math.round(x) + i, yy = Math.round(y) + j;
        if (xx >= 0 && yy >= 0 && xx < n && yy < n) { s += g[yy * n + xx]; c++; }
      }
      return c ? s / c : 255;
    };
    const rows = [];
    for (let y = l.y - 0.85 * l.r; y <= l.y + 0.85 * l.r + 1e-6; y += 0.5) {
      let xl = null, xr = null;
      for (let d = 0; d <= 2.2 * l.r; d += 0.5) { if (sm(l.x - d, y) > T) { xl = l.x - d; break; } }
      for (let d = 0; d <= 2.2 * l.r; d += 0.5) { if (sm(l.x + d, y) > T) { xr = l.x + d; break; } }
      if (xl != null && xr != null) rows.push({ y: y, xl: xl, xr: xr, w: xr - xl });
    }

    rows.forEach(function (q) { if (q.w > wmax) wmax = q.w; });
    let sy = 0, sx = 0, sw = 0, c = 0;
    rows.forEach(function (q) { if (q.w >= 0.97 * wmax) { sy += q.y; sx += (q.xl + q.xr) / 2; sw += q.w; c++; } });

  function zoneList() { try { if (Intl.supportedValuesOf) return Intl.supportedValuesOf('timeZone'); } catch (e) {} return PRESETS.map((p) => p.tz); }
  function zoneSelect(cur) {
    const s = el('select', { 'aria-label': 'Fuso horário' }); s.append(el('option', { value: '', text: 'Automático (aproximado pela longitude)' }));
    zoneList().forEach((z) => s.append(el('option', { value: z, text: z }))); s.value = cur || ''; return s;
  }
  async function pickZone(L) {
    const s = zoneSelect(L.tz), r = await ui.modal({ title: 'Fuso horário de "' + L.name + '"', body: s, dismiss: undefined, buttons: [{ label: 'Cancelar', value: undefined, cls: 'quiet' }, { label: 'Salvar', cls: 'pri', onClick: () => ({ z: s.value }) }] });
    if (!r) return; const p = pins.find((x) => x.id === L.id); p.tz = r.z || null; await Store.put('pins', p); renderPanel();
  }
  async function createPin(lat, lon) {
    const name = el('input', { type: 'text', placeholder: 'Nome do pin', maxlength: 60, 'aria-label': 'Nome do pin' }), s = zoneSelect('');
    const body = el('div', { class: 'mlist' }, name, s, el('div', { class: 'meta', text: 'Lat ' + lat.toFixed(2) + ', Lon ' + lon.toFixed(2) }));
    const r = await ui.modal({ title: 'Novo pin', body: body, dismiss: undefined, buttons: [{ label: 'Cancelar', value: undefined, cls: 'quiet' }, { label: 'Criar', cls: 'pri', onClick: () => (name.value.trim() ? { n: name.value.trim(), z: s.value } : false) }] });
    if (!r) return;
    const p = { id: 'pin:' + uid(), name: r.n, lat: lat, lon: lon, tz: r.z || null, note: '', created: Date.now() };
    await Store.put('pins', p); pins.push(p); Sfx.ok(); select(p.id);
  }

  /* ----- visualizador de fotos e vídeos ----- */
  function lightbox(list, i0) {
    const box = $('lightbox'); let i = i0, urls = []; box.hidden = false;
    const close = () => { urls.forEach((u) => URL.revokeObjectURL(u)); urls = []; box.hidden = true; box.textContent = ''; document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); };
    function go(d) { i = (i + d + list.length) % list.length; show(); }
    function show() {
      urls.forEach((u) => URL.revokeObjectURL(u)); urls = []; const m = list[i]; box.textContent = '';
      const media2 = m.kind === 'video' ? mediaEl('video', m.blob, { controls: true, playsinline: true }, urls) : mediaEl('img', m.blob, { alt: m.name }, urls);
      box.append(el('div', { class: 'lbtop' }, el('button', { type: 'button', class: 'sm', text: '✕ Fechar', onclick: close }),
        list.length > 1 ? el('button', { type: 'button', class: 'sm', text: '‹', 'aria-label': 'Anterior', onclick: () => go(-1) }) : null, list.length > 1 ? el('button', { type: 'button', class: 'sm', text: '›', 'aria-label': 'Próximo', onclick: () => go(1) }) : null,
        el('span', { class: 'meta', text: m.name + ' (' + (i + 1) + '/' + list.length + ')' }), el('span', { class: 'grow' }),
        canDownload(m.name) ? el('button', { type: 'button', class: 'sm', text: 'Baixar', onclick: () => saveFile(m.name, m.blob) }) : null,
        el('button', { type: 'button', class: 'sm danger', text: 'Excluir', onclick: async () => { if (!(await ui.confirm('Excluir "' + m.name + '"?', { ok: 'Excluir', danger: true }))) return; await Store.del('media', m.id); media = media.filter((x) => x.id !== m.id); close(); Sfx.err(); renderPanel(); } })),
        el('div', { class: 'lbmedia' }, media2));
    }
    document.addEventListener('keydown', onKey); show();
  }

  /* ----- relógio (1 s) ----- */
  function tick() {
    if (!visible) return; const now = new Date();
    if (!tick.at || now.getTime() - tick.at > 20000) { tick.at = now.getTime(); locs().forEach((L) => state.set(L.id, dayState(L, now))); }
    clocks.forEach((c) => {
      const inf = info(c.L, now), st = state.get(c.L.id) || dayState(c.L, now);
      if (c.tm) { c.tm.textContent = inf.hm; c.dn.className = 'dn ' + st; }
      if (c.big) {
        c.big.textContent = inf.time; c.kv.textContent = '';
        const rows = [['Data', inf.date], ['Fuso', inf.off], ['Agora', DN[st]], ['Coordenadas', c.L.lat.toFixed(2) + ', ' + c.L.lon.toFixed(2)]];
        rows.forEach((r) => c.kv.append(el('div', {}, r[0] + ': ', el('b', { text: r[1] }))));
        const s = Astro.sunTimes(c.L.lat, c.L.lon, now); c.sun.textContent = '';
        c.sun.append(el('div', {}, s.polar ? (s.polar === 'day' ? 'Sol da meia-noite: sem pôr do sol hoje' : 'Noite polar: sem nascer do sol hoje') : ['Nascer: ', el('b', { text: hmOf(c.L, s.rise) }), '   Pôr: ', el('b', { text: hmOf(c.L, s.set) })]));
      }
    });
  }

  /* ----- ciclo de vida ----- */
  function init() {
    cv = $('mapcv'); ctx = cv.getContext('2d'); wrap = $('mapwrap'); bindGestures();
    if (window.ResizeObserver) new ResizeObserver(() => { if (visible) resize(); }).observe(wrap); window.addEventListener('resize', () => { if (visible) resize(); });
  }
  async function show() {
    visible = true; if (!loaded) await loadData();
    resize(); locs().forEach((L) => state.set(L.id, dayState(L, new Date()))); renderPanel(); ensureWorld();
    clearInterval(tickTimer); tickTimer = setInterval(tick, 1000); cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  }
  function hide() { visible = false; clearInterval(tickTimer); cancelAnimationFrame(raf); }
  return { init: init, show: show, hide: hide };
})();

/* ===== início ===== */
(async function main() {
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  await Promise.race([fontsReady, sleep(1200)]);
  WS.init(); MapTab.init();
  const mute = $('mute');
  const upd = () => { mute.textContent = Sfx.isMuted() ? '♪ ✕' : '♪'; mute.setAttribute('aria-pressed', String(Sfx.isMuted())); mute.setAttribute('aria-label', Sfx.isMuted() ? 'Ligar som' : 'Desligar som'); };
  mute.addEventListener('click', () => { Sfx.init(); Sfx.setMuted(!Sfx.isMuted()); upd(); if (!Sfx.isMuted()) Sfx.click(); });
  upd();
  $('startBtn').addEventListener('click', async () => {
    Sfx.init(); Sfx.boot(); $('startBox').hidden = true; $('scanBox').hidden = false;
    const force = ssGet('odd_reenroll') === '1'; if (force) ssDel('odd_reenroll');
    const res = await Lock.start({ forceEnroll: force });
    $('lock').style.display = 'none';       // tela preta (< 1 s)
    await sleep(650);
    await Eye.run({});
    Eye.hideWelcome();
    await WS.open(res);
  });
})();

})();
</script>
